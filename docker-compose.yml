name: mecaytro

services:
  mecaytro-postgres:
    image: postgres:18-alpine
    container_name: mecaytro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env.production}
    volumes:
      - mecaytro-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  mecaytro-backend:
    image: mecaytro-backend:latest
    container_name: mecaytro-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      mecaytro-postgres:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mecaytro-frontend:
    image: mecaytro-frontend:latest
    container_name: mecaytro-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://192.168.20.100}
    restart: unless-stopped
    depends_on:
      mecaytro-backend:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  mecaytro-postgres-data: