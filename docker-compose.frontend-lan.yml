services:
  mecaytro-frontend:
    image: nginx:1.27-alpine
    container_name: mecaytro-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /opt/mecaytro/frontend/dist:/usr/share/nginx/html:ro
      - /opt/mecaytro/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mecaytro-network

networks:
  mecaytro-network:
    external: true
    name: mecaytro_mecaytro-network